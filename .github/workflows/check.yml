name: check
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      # Tests that need the platform's sandbox fail here rather than skip.
      COMPA_REQUIRE_SANDBOX: 1
    steps:
      - uses: actions/checkout@v7
        with:
          # golangci-lint compares with the merge base (.golangci.yml).
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
          install-only: true
      - run: go install honnef.co/go/tools/cmd/staticcheck@2026.2.2
      - if: runner.os == 'Linux'
        # bubblewrap, at /usr/bin/bwrap, is Linux's sandbox; prlimit, in
        # util-linux, is already at /usr/bin/prlimit. Ubuntu restricts
        # unprivileged user namespaces through AppArmor, which leaves bwrap
        # unable to make its own, so the restriction is lifted.
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - if: runner.os == 'macOS'
        run: command -v shellcheck || brew install shellcheck
      - run: make check
  standards:
    uses: lowmagic/.github/.github/workflows/standards-check.yml@main
