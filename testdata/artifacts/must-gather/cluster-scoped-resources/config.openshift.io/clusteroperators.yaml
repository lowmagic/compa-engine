apiVersion: config.openshift.io/v1
kind: ClusterOperatorList
items:
  - metadata: {name: dns}
    status:
      conditions:
        - {type: Available, status: "True"}
        - {type: Degraded, status: "False"}
  - metadata: {name: network}
    status:
      conditions:
        - {type: Available, status: "True"}
        - {type: Degraded, status: "True", reason: RolloutHung}
  - metadata: {name: machine-config}
    status:
      conditions:
        - {type: Available, status: "True"}
        - {type: Degraded, status: "True", reason: RequiredPoolsFailed}
