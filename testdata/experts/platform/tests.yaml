apiVersion: compa.lowmag.cc/expert/v1alpha2
kind: Tests
tests:
  - id: platform.node_conditions
    version: 0.1.0
    description: Node readiness conditions from a must-gather.
    params:
      node: {type: string, default: '', maxLength: 253, pattern: '^[a-z0-9.-]*$'}
    preconditions: [{exists: cluster-scoped-resources/core/nodes}]
    run:
      - yq:
          path: cluster-scoped-resources/core/nodes
          glob: '*.yaml'
          filter: 'select($node == "" or .metadata.name == $node) | {name: .metadata.name, ready: (.status.conditions[] | select(.type == "Ready") | .status)}'
    output: {format: json}
    interpret: analyst.md#node-conditions
    fixtures: fixtures/nodes
  - id: platform.degraded_operators
    version: 0.1.0
    description: ClusterOperators reporting Degraded=True.
    run:
      - read: cluster-scoped-resources/config.openshift.io/clusteroperators.yaml
      - yq: {raw: true, filter: '.items[] | select(.status.conditions[] | select(.type == "Degraded" and .status == "True")) | .metadata.name'}
    output: {format: lines}
    interpret: analyst.md#degraded-operators
