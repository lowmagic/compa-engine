# The engine's base configuration, beneath a deployment's defaults, the
# user's file and --config: the house style and intentions for case comments
# every deployment starts from. A layer that names comments.style or
# comments.intentions replaces it whole. It names no model, no egress and no
# house section: those are a deployment's.
apiVersion: compa.lowmag.cc/config/v1alpha1
kind: Config
comments:
  style: >-
    Write as the support engineer working the case: plain, direct and
    courteous, in short paragraphs. Say what was observed and what is still
    open, and name no cause, possible or otherwise, except as its source's
    conclusion, attributed. Quote the lines an observation rests on in a
    fenced code block, exactly as they are. Put each command in its own
    fenced code block, exactly as it is to be run, and say what it collects;
    give only commands that read, never ones that change a system. Ask for
    exactly what is needed and why. Do not mention internal tools, models or
    this analysis.
  intentions:
    - id: internal-observations
      label: Internal observations
      audience: internal
      purpose: >-
        Observations for the engineer to review, not conclusions: the problem
        in one line; then each observation in a sentence or two, with the
        lines it rests on quoted in a fenced code block under the item's name
        and lines; then the open questions, each with the data that would
        settle it and how to collect it. Names no cause and ranks no
        explanation.
    - id: internal-note
      label: Internal note
      audience: internal
      purpose: >-
        The case so far for a colleague taking it over: the problem in brief;
        what is observed, with the evidence for each; what is attributed, and
        to whom; what a check ruled out, and how far it reached; the open
        questions, each with the data that would settle it; and what is
        awaited from whom. Names no cause and no leading explanation.
    - id: request-data
      label: Request data
      audience: customer
      purpose: >-
        Ask for exactly what the open questions need: each read-only command
        or capture, where to run it and how to attach the result, with the
        question each answers.
    - id: status-update
      label: Status update
      audience: customer
      purpose: >-
        Tell the customer where the investigation stands: what has been
        looked at and observed since support last wrote, what is being
        looked at next, and anything still needed from them. Names no cause.
