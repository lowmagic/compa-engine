# Synthetic: a catalog whose capture kinds name their identity tools.
apiVersion: compa.lowmag.cc/expert/v1alpha2
kind: Catalog
metadata: {id: openshift.gather, version: 0.1.0}
spec:
  engineApi: '>=0.2.1 <0.3.0'
  tests: [openshift.gather.capture_identity, openshift.gather.pods]
  captures:
    - {kind: must-gather, marks: [cluster-scoped-resources], identity: capture_identity}
    - {kind: inspect, marks: [namespaces]}
