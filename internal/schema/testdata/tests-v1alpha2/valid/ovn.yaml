apiVersion: compa.lowmag.cc/expert/v1alpha2
kind: Tests
tests:
  - id: networking.ovn_pods
    version: 0.1.0
    description: OVN-Kubernetes pod phases and restart counts.
    params:
      namespace: {type: string, default: openshift-ovn-kubernetes, pattern: '^[a-z0-9-]+$'}
    run:
      - [omc, get, pods, -n, '{{namespace}}', -o, json]
      - jq: '.items[] | {name: .metadata.name, phase: .status.phase}'
    output: {format: json}
    interpret: analyst.md#ovn-pods
    fixtures: fixtures/ovn-pods/
  - id: networking.ovn_errors
    version: 0.1.0
    params:
      max: {type: integer, default: 50, minimum: 1, maximum: 500}
    preconditions: [{exists: 'namespaces/openshift-ovn-kubernetes'}]
    run:
      - grep: {pattern: 'error', path: 'namespaces/openshift-ovn-kubernetes', max_matches: '{{max}}'}
      - logs.count: {}
