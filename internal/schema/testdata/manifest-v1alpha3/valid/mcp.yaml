apiVersion: compa.lowmag.cc/expert/v1alpha3
kind: Expert
metadata: {id: openshift.etcd, version: 0.1.0, summary: 'A manifest for the schema''s tests'}
spec:
  engineApi: '>=0.2.0 <0.3.0'
  analyst: analyst.md
  mcp:
    command: [python3, mcp/server.py]
    network: false
    budget: {timeoutSeconds: 30, memoryMB: 256}
    tools:
      - name: etcd.defrag_estimate
        risk: read_only
        inputSchema: {type: object}
        outputSchema: {type: object}
